<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI + 城市规划 | Urban Planning Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Press Start 2P', cursive;
            background: #fff;
            color: #000;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .bg-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 40px 40px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 0 30px;
            position: relative;
        }
        header h1 {
            font-size: 42px;
            letter-spacing: 8px;
            margin-bottom: 30px;
            color: #000;
            line-height: 1.5;
        }
        .ai-text {
            display: inline-block;
            position: relative;
            animation: ai-blink 1s steps(2) infinite;
        }
        @keyframes ai-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        header p, .subtitle {
            font-size: 20px;
            letter-spacing: 6px;
            color: #fff;
            background: #000;
            display: inline-block;
            padding: 8px 20px;
        }
        .modules {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1100px;
        }
        .module {
            background: #fff;
            border: none;
            padding: 35px 25px;
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
        }
        .module:hover {
            background: #000;
            color: #fff;
            transform: translateY(-6px);
            box-shadow: 6px 6px 0 #888;
        }
        .module:hover .module-num,
        .module:hover .module-title,
        .module:hover .module-desc {
            color: #fff;
        }
        .module:hover .module-icon svg {
            fill: #fff;
        }
        .module.disabled {
            border-style: dashed;
        }
        .module.disabled:hover {
            background: #888;
            color: #fff;
            transform: none;
        }
        .module-num {
            font-size: 14px;
            letter-spacing: 2px;
            color: #000;
        }
        .module:hover {
            background: #bbb;
            color: #000;
            transform: translateY(-6px);
            box-shadow: 6px 6px 0 #555;
        }
        .module:hover .module-num,
        .module:hover .module-title,
        .module:hover .module-desc {
            color: #000;
        }
        .module:hover .module-icon svg {
            fill: #000;
        }
        .module.disabled {
            border-style: dashed;
        }
        .module.disabled:hover {
            background: #000;
            color: #fff;
            transform: none;
            box-shadow: none;
        }
        .module-num {
            font-size: 9px;
            letter-spacing: 2px;
            color: #000;
            margin-bottom: 20px;
        }
        .module-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
        }
        .module-icon svg {
            width: 100%;
            height: 100%;
            fill: #000;
        }
        .module:nth-child(1) .module-icon {
            animation: icon-bounce1 0.8s ease-in-out infinite;
        }
        .module:nth-child(3) .module-icon svg rect {
            animation: bar-dance 0.5s ease-in-out infinite;
            transform-origin: bottom;
        }
        .module:nth-child(3) .module-icon svg rect:nth-child(1) { animation-delay: 0s; }
        .module:nth-child(3) .module-icon svg rect:nth-child(2) { animation-delay: 0.1s; }
        .module:nth-child(3) .module-icon svg rect:nth-child(3) { animation-delay: 0.2s; }
        .module:nth-child(3) .module-icon svg rect:nth-child(4) { animation-delay: 0.3s; }
        @keyframes bar-dance {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.4); }
        }
        .module:nth-child(1):hover .module-icon {
            animation: icon-spin 0.6s ease-in-out infinite;
        }
        @keyframes icon-spin {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }
        .module:nth-child(2) .module-icon {
            animation: node-pulse 2s ease-in-out infinite;
        }
        @keyframes node-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes icon-bounce1 {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .module-title {
            font-size: 16px;
            letter-spacing: 1px;
            margin-bottom: 14px;
            text-align: center;
        }
        .module-desc {
            font-size: 12px;
            line-height: 2.2;
            color: #ddd;
            text-align: center;
        }
        .module-arrow {
            position: absolute;
            right: 16px;
            bottom: 16px;
            font-size: 14px;
            color: #000;
            animation: arrow-blink 0.8s step-end infinite;
        }
        .module.disabled .module-arrow {
            display: none;
        }
        @keyframes arrow-blink {
            50% { opacity: 0; }
        }
        .tag {
            position: absolute;
            top: -1px;
            right: -1px;
            background: #fff;
            color: #000;
            font-size: 7px;
            padding: 5px 8px;
        }
        .module.disabled .tag {
            background: #ccc;
        }
        footer {
            text-align: center;
            padding-top: 30px;
        }
        footer p {
            font-size: 8px;
            letter-spacing: 2px;
            color: #000;
        }
        @media (max-width: 900px) {
            .modules { grid-template-columns: 1fr; }
            header h1 { font-size: 24px; letter-spacing: 4px; }
        }
    </style>
</head>
<body>
    <canvas class="bg-lines" id="bgCanvas"></canvas>
    <div class="container">
        <header>
            <h1>URBAN PLANNING INTELLIGENCE<br><span class="ai-text">AI+</span></h1>
            <p class="subtitle">城市规划智能</p>
        </header>

        <div class="modules">
            <div class="module" onclick="location.href='module1/intro.html'">
                <div class="module-num">MODULE 01</div>
                <div class="module-icon">
                    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="8" width="12" height="12"/>
                        <rect x="20" y="8" width="12" height="12"/>
                        <rect x="36" y="8" width="12" height="12"/>
                        <rect x="52" y="8" width="8" height="12"/>
                        <rect x="4" y="24" width="12" height="12"/>
                        <rect x="20" y="24" width="12" height="12"/>
                        <rect x="36" y="24" width="12" height="12"/>
                        <rect x="4" y="40" width="12" height="12"/>
                        <rect x="20" y="40" width="12" height="12"/>
                        <rect x="36" y="40" width="12" height="12"/>
                    </svg>
                </div>
                <div class="module-title">数据抓取与可视化</div>
                <div class="module-desc">AI自动采集城市数据<br>整合多源信息<br>数据清洗与可视化</div>
                <div class="module-arrow">></div>
            </div>

            <div class="module" onclick="location.href='module2/intro.html'">
                <div class="module-num">MODULE 02</div>
                <div class="module-icon">
                    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="16" cy="16" r="10" fill="#000"/>
                        <circle cx="48" cy="16" r="10" fill="#000"/>
                        <circle cx="32" cy="36" r="10" fill="#000"/>
                        <circle cx="16" cy="52" r="10" fill="#000"/>
                        <circle cx="48" cy="52" r="10" fill="#000"/>
                        <line x1="16" y1="26" x2="32" y2="26" stroke="#000" stroke-width="3"/>
                        <line x1="48" y1="26" x2="32" y2="26" stroke="#000" stroke-width="3"/>
                        <line x1="16" y1="42" x2="32" y2="42" stroke="#000" stroke-width="3"/>
                        <line x1="48" y1="42" x2="32" y2="42" stroke="#000" stroke-width="3"/>
                    </svg>
                </div>
                <div class="module-title">知识图谱建构</div>
                <div class="module-desc">2026年全国与广州<br>房地产政策对比分析<br>三元组知识抽取</div>
                <div class="module-arrow">></div>
            </div>

            <div class="module" onclick="location.href='module3/index.html'">
                <div class="module-num">MODULE 03</div>
                <div class="module-icon">
                    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="48" width="10" height="12"/>
                        <rect x="18" y="36" width="10" height="24"/>
                        <rect x="32" y="24" width="10" height="36"/>
                        <rect x="46" y="8" width="10" height="52"/>
                    </svg>
                </div>
                <div class="module-title">开发强度分析</div>
                <div class="module-desc">基于用地边界数据<br>空间分析方法<br>评估开发强度潜力</div>
                <div class="module-arrow">></div>
            </div>
        </div>

        <footer>
            <p>POWERED BY ARTIFICIAL INTELLIGENCE</p>
        </footer>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            const numLines = 150;
            let globalPhase = 0;
            const phaseSpeed = 0.012;
            const rocks = [];
            const numRocks = 5;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            function initRocks() {
                rocks.length = 0;
                const marginX = canvas.width * 0.08;
                const marginY = canvas.height * 0.12;
                for (let i = 0; i < numRocks; i++) {
                    rocks.push({
                        x: marginX + Math.random() * (canvas.width - marginX * 2),
                        y: marginY + Math.random() * (canvas.height - marginY * 2),
                        baseX: marginX + Math.random() * (canvas.width - marginX * 2),
                        baseY: marginY + Math.random() * (canvas.height - marginY * 2),
                        r: 50 + Math.random() * 80,
                        intensity: 0.5 + Math.random() * 0.5,
                        phase: Math.random() * Math.PI * 2,
                        speed: 0.3 + Math.random() * 0.8,
                        movePhaseX: Math.random() * Math.PI * 2,
                        movePhaseY: Math.random() * Math.PI * 2,
                        moveSpeedX: 0.1 + Math.random() * 0.3,
                        moveSpeedY: 0.05 + Math.random() * 0.2,
                        moveAmpX: 30 + Math.random() * 60,
                        moveAmpY: 15 + Math.random() * 30
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.lineWidth = 1;

                for (const rock of rocks) {
                    rock.x = rock.baseX + Math.sin(globalPhase * rock.moveSpeedX + rock.movePhaseX) * rock.moveAmpX;
                    rock.y = rock.baseY + Math.sin(globalPhase * rock.moveSpeedY + rock.movePhaseY) * rock.moveAmpY;
                }

                const spacing = canvas.height / (numLines + 1);

                for (let i = 0; i < numLines; i++) {
                    const baseY = spacing * (i + 1);
                    ctx.beginPath();

                    for (let x = 0; x <= canvas.width; x += 3) {
                        let totalWave = 0;

                        for (const rock of rocks) {
                            const dx = x - rock.x;
                            const dy = baseY - rock.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            const radius = rock.r;

                            if (dist > radius && dist < radius + 150) {
                                const wave = Math.sin((dist - radius) * 0.06 - globalPhase * rock.speed + rock.phase);
                                const amp = Math.exp(-(dist - radius) * 0.02) * 15 * rock.intensity;
                                totalWave += wave * amp;
                            }
                        }

                        const flowWave = Math.sin(x * 0.004 + globalPhase * 0.4) * 2;
                        const finalY = baseY + totalWave + flowWave;

                        if (x === 0) {
                            ctx.moveTo(x, finalY);
                        } else {
                            ctx.lineTo(x, finalY);
                        }
                    }

                    ctx.stroke();
                }

                ctx.fillStyle = 'rgba(0,0,0,0.12)';
                for (const rock of rocks) {
                    ctx.beginPath();
                    ctx.ellipse(rock.x, rock.y, rock.r * 1.3, rock.r * 0.75, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                globalPhase += phaseSpeed;

                requestAnimationFrame(draw);
            }

            window.addEventListener('resize', resize);
            resize();
            initRocks();
            draw();
        })();
    </script>
</body>
</html>
